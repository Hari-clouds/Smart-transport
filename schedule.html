<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RIT Smart Transport — Bus Schedule</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="schedule.css" />
</head>
<body>

  <div class="page-bg">
    <div class="container sch-container">

      <!-- Header -->
      <div class="app-header">
        <div class="logo-wrap">
          <svg class="bus-svg" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1" y="3" width="15" height="13" rx="2"/>
            <path d="M16 8h4l3 3v5h-7V8z"/>
            <circle cx="5.5" cy="18.5" r="2.5"/>
            <circle cx="18.5" cy="18.5" r="2.5"/>
          </svg>
        </div>
        <div class="header-text">
          <h1>RIT Smart Transport</h1>
          <p>Complete Bus Schedule — 51 Routes</p>
        </div>
        <div class="arrival-badge">
          <span class="arrival-label">Campus Arrival</span>
          <span class="arrival-time">7:40 AM</span>
        </div>
        <a href="index.html" class="admin-link-btn" title="Back to Route Finder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/>
          </svg>
          Route Finder
        </a>
        <button class="admin-link-btn" onclick="clearSession()" title="Logout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Logout
        </button>
      </div>

      <!-- Controls -->
      <div class="sch-controls">
        <div class="sch-search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="sch-search-icon">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="schSearch" placeholder="Search route or area…" oninput="schFilter()" autocomplete="off" />
        </div>

        <div class="sch-sort-group">
          <span class="sch-sort-label">Sort by:</span>
          <button class="sch-sort-btn active" id="sortTime"   onclick="schSort('time')">Departure Time</button>
          <button class="sch-sort-btn"        id="sortRoute"  onclick="schSort('route')">Route No.</button>
          <button class="sch-sort-btn"        id="sortDur"    onclick="schSort('dur')">Duration</button>
        </div>

        <button class="sch-print-btn" onclick="window.print()" title="Print schedule">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14">
            <polyline points="6 9 6 2 18 2 18 9"/>
            <path d="M6 18H4a2 2 0 01-2-2v-5a2 2 0 012-2h16a2 2 0 012 2v5a2 2 0 01-2 2h-2"/>
            <rect x="6" y="14" width="12" height="8"/>
          </svg>
          Print
        </button>
      </div>

      <div class="sch-result-bar">
        <span id="schCount">51 routes</span>
        <span class="sch-campus-note">All routes arrive at RIT Campus by 7:40 AM</span>
      </div>

      <!-- Table -->
      <div class="sch-table-wrap">
        <table class="sch-table" id="schTable">
          <thead>
            <tr>
              <th class="col-no">Route</th>
              <th class="col-area">Starting Area</th>
              <th class="col-depart">Departure</th>
              <th class="col-arrive">Arrives</th>
              <th class="col-dur">Duration</th>
              <th class="col-stops">Stops</th>
              <th class="col-action print-hide">Action</th>
            </tr>
          </thead>
          <tbody id="schBody"></tbody>
        </table>
        <div class="sch-empty" id="schEmpty" style="display:none">No matching routes found.</div>
      </div>

      <!-- Summary cards (early / late / longest) -->
      <div class="sch-cards" id="schCards"></div>

    </div>
  </div>

  <script src="auth.js"></script>
  <script>checkAuth(['student','staff']);</script>
  <script src="routes.js"></script>
  <script src="schedule.js"></script>

</body>
</html>
