<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RIT Transport — Parent Portal</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="parent.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>
<body>
<div class="page-bg">
  <div class="container par-container">

    <!-- Header: same style as index.html app-header -->
    <div class="app-header">
      <div class="logo-wrap">
        <svg class="bus-svg" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="3" width="15" height="13" rx="2"/>
          <path d="M16 8h4l3 3v5h-7V8z"/>
          <circle cx="5.5" cy="18.5" r="2.5"/>
          <circle cx="18.5" cy="18.5" r="2.5"/>
        </svg>
      </div>
      <div class="header-text">
        <h1>RIT Smart Transport</h1>
        <p>Parent Portal</p>
      </div>
      <div class="arrival-badge">
        <span class="arrival-label">Campus Arrival</span>
        <span class="arrival-time">7:40 AM</span>
      </div>
      <button class="admin-link-btn" onclick="clearSession()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Logout
      </button>
    </div>

    <!-- Child Info Card -->
    <div class="par-child-card" id="parChildCard">
      <!-- populated by JS: shows studentName, route, boarding status -->
    </div>

    <!-- Boarding Status Section -->
    <div class="par-section">
      <div class="par-section-title">Boarding Status</div>
      <div class="par-boarding-status" id="parBoardingStatus">
        <!-- populated by JS -->
      </div>
    </div>

    <!-- Boarding Pass (shown if child has boarded) -->
    <div class="par-section" id="parBoardingPassSection" style="display:none">
      <div class="par-section-title">Boarding Pass</div>
      <div class="par-pass-card" id="parPassCard">
        <!-- populated by JS -->
      </div>
    </div>

    <!-- Notification Bell Section -->
    <div class="par-section">
      <div class="par-section-title">
        Notifications
        <span class="par-notif-badge" id="parNotifBadge" style="display:none">0</span>
      </div>
      <div class="par-notif-list" id="parNotifList">
        <div class="par-notif-empty">No notifications yet.</div>
      </div>
    </div>

    <!-- Live Tracking Map -->
    <div class="par-section">
      <div class="par-section-title">Live Bus Location — Route <span id="parRouteLabel"></span></div>
      <div id="parMapContainer" style="height:320px;border-radius:12px;overflow:hidden"></div>
      <div class="par-map-status" id="parMapStatus">Waiting for bus GPS signal…</div>
    </div>

  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="auth.js"></script>
<script>checkAuth(['parent']);</script>
<script src="routes.js"></script>
<script src="parent.js"></script>
</body>
</html>
